<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Daedalus Backlog Scrub</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <a href="#/" class="brand-link">
        <span class="brand-mark">◇</span>
        <span class="brand-name">Daedalus Scrub</span>
      </a>
    </div>
    <nav class="appnav">
      <a href="#/" class="navlink" data-route="home">Portfolio</a>
      <div class="bu-switch">
        <label for="bu-jump" class="bu-switch-label">Jump to BU</label>
        <select id="bu-jump"><option value="">—</option></select>
      </div>
    </nav>
    <div class="appmeta">
      <div class="status-line">
        <span id="scorer-status" class="status"></span>
        <span id="jira-status" class="status"></span>
        <span id="generated" class="status"></span>
      </div>
      <div class="actor-line">
        <label for="actor">actor</label>
        <input id="actor" placeholder="your name">
        <button class="mini-btn" id="refreshAll" title="Re-read live data">Refresh all</button>
      </div>
    </div>
  </header>
  <main id="app"></main>

  <div class="modal-backdrop" id="modal">
    <div class="modal" id="modal-body"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
