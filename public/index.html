<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Initiative Reviewer</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="side-head">
        <a href="#/" class="brand-link" title="Initiative Reviewer">
          <span class="brand-mark">◇</span>
          <span class="brand-name">Initiative Reviewer</span>
        </a>
        <button class="side-toggle" id="side-toggle" aria-label="Toggle sidebar">
          <span class="chev">‹</span>
        </button>
      </div>

      <nav class="side-nav">
        <a href="#/" class="side-item" data-route="home" title="Portfolio">
          <span class="ico">▦</span>
          <span class="lbl">Portfolio</span>
        </a>
        <a href="#/initiatives" class="side-item" data-route="initiatives" title="Browse by Initiative">
          <span class="ico">◇</span>
          <span class="lbl">Initiatives</span>
        </a>
        <a href="#/prompt" class="side-item" data-route="prompt" title="AI evaluation rules">
          <span class="ico">⚙</span>
          <span class="lbl">AI rules</span>
        </a>
        <button class="side-item side-search-trigger" id="side-search" title="Search Epics — Cmd/Ctrl+K" type="button">
          <span class="ico">⌕</span>
          <span class="lbl">Search <kbd class="side-kbd">⌘K</kbd></span>
        </button>
      </nav>

      <div class="side-section">
        <div class="side-heading">Business Units</div>
        <div class="side-bus" id="side-bus"></div>
      </div>

      <div class="side-foot">
        <div class="side-status" id="side-status"></div>
        <div class="side-actor" id="side-actor"></div>
      </div>
    </aside>

    <main id="app"></main>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal" id="modal-body"></div>
  </div>

  <div class="toast-stack" id="toasts" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
